<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | SecureAuth</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>


<div class="container">

<div class="auth-card">

<h1>Welcome Back 👋</h1>

<p class="subtitle">
Login to access your dashboard
</p>


<form id="loginForm">


<div class="input-box">
<input 
type="email"
id="loginEmail"
placeholder="Email Address"
required>
</div>



<div class="input-box">

<input 
type="password"
id="loginPassword"
placeholder="Password"
required>

</div>



<button type="submit">
Login
</button>


<p id="loginError" class="error"></p>


<p class="switch">

Don't have an account?

<a href="register.html">
Register
</a>

</p>


</form>


</div>

</div>



<script src="js/auth.js"></script>

</body>
</html>
