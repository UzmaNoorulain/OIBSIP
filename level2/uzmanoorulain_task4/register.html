<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="container">


<div class="auth-card">


<h1>Create Account 🚀</h1>


<p class="subtitle">
Join SecureAuth today
</p>



<form id="registerForm">


<div class="input-box">

<input
type="text"
id="username"
placeholder="Username"
required>

</div>



<div class="input-box">

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>



<div class="input-box">

<input
type="password"
id="password"
placeholder="Password"
required>

</div>



<button type="submit">
Register
</button>



<p id="registerError" class="error"></p>


<p id="registerSuccess" class="success"></p>



<p class="switch">

Already have an account?

<a href="index.html">
Login
</a>

</p>



</form>



</div>

</div>


<script src="js/auth.js"></script>


</body>

</html>
